<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starz Shots Gallery</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles.extra.css" />
</head>
<body>
  <main>
    <section class="access-screen" data-view="access">
      <div class="access-panel">
        <p class="brand">Starz Shots Gallery</p>
        <h1 id="accessTitle">Enter your gallery access</h1>
        <p id="accessMeta" class="muted">Loading event details…</p>
        <form id="accessForm">
          <label for="viewerId">Your name or email</label>
          <input id="viewerId" name="viewerId" type="text" autocomplete="name" required />
          <label for="accessCode">Access code</label>
          <input id="accessCode" name="accessCode" type="password" autocomplete="one-time-code" required />
          <div class="access-row">
            <button type="submit">Open gallery</button>
          </div>
          <p id="accessError" class="error"></p>
          <p class="access-help">Use the code provided by your photographer to view and save your photos.</p>
        </form>
      </div>
    </section>

    <section class="gallery-screen hidden" data-view="gallery">
      <div class="hero">
        <img id="coverImage" src="" alt="Gallery cover" />
        <div class="hero-overlay">
          <div>
            <p class="brand">Starz Shots Gallery</p>
            <h1 id="eventName">Event name</h1>
            <p id="eventDate" class="muted">Event date</p>
            <p id="clientName" class="muted">Client name</p>
          </div>
          <p id="visitorRole" class="role-badge">Role</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="scene-tabs" id="sceneTabs"></div>
        <div class="actions">
          <button type="button" id="showAll" class="tab active">All</button>
          <button type="button" id="showFavorites" class="tab">Favorites (0)</button>
          <button type="button" id="downloadFavoritesCsv" class="icon-button">Download favorites</button>
          <a id="findMyPhotos" class="icon-button" href="#">Find my photos</a>
        </div>
      </div>
      <p id="syncNotice" class="sync-notice hidden"></p>
      <section class="gallery-grid" id="galleryGrid"></section>
      <div id="gridSentinel" class="grid-sentinel"></div>
      <p id="gridStatus" class="grid-status muted"></p>
    </section>

    <div id="selectionBar" class="selection-bar hidden" role="toolbar" aria-label="Selected photo actions">
      <span class="selection-count"><b id="selectionCount">0</b> selected</span>
      <button type="button" id="selectionClear" class="selection-clear" title="Clear selection" aria-label="Clear selection"></button>
      <span class="selection-divider" aria-hidden="true"></span>
      <button type="button" id="selectionDownload" class="selection-action" title="Download" aria-label="Download"></button>
      <button type="button" id="selectionHide" class="selection-action" title="Hide from guests" aria-label="Hide from guests"></button>
      <button type="button" id="selectionCover" class="selection-action hidden" title="Set as cover photo" aria-label="Set as cover photo"></button>
      <button type="button" id="selectionDelete" class="selection-action danger" title="Delete" aria-label="Delete"></button>
    </div>
  </main>

  <dialog id="lightbox">
    <button id="closeLightbox" class="close-button" type="button">×</button>
    <button id="previousImage" class="lightbox-nav previous" type="button">←</button>
    <button id="nextImage" class="lightbox-nav next" type="button">→</button>
    <img id="lightboxImage" alt="Photo preview" />
    <footer>
      <div>
        <p id="lightboxScene" class="muted">Scene</p>
        <p id="lightboxFilename" class="muted">Filename</p>
      </div>
      <div class="dialog-actions">
        <button id="lightboxFavorite" type="button">Favorite</button>
        <button id="lightboxHide" type="button" class="hidden">Hide from guests</button>
        <button id="lightboxRemove" type="button">Remove</button>
        <a id="lightboxDownload" class="download-button" target="_blank" rel="noopener" download>Download</a>
      </div>
    </footer>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
